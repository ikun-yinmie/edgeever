name: Build custom Docker image

# ikun-yinmie/edgeever 自定义构建：独立于上游 docker-image.yml（其任务被
# github.repository == 'tianma-if/edgeever' 守卫跳过），发布到本仓库的 GHCR：
#   ghcr.io/ikun-yinmie/edgeever
# 推送到 main（改动了产品代码）→ 构建 + 容器冒烟测试 + 发布 :main / :sha-xxxx
# 发布正式 Release vX.Y.Z → 发布 :vX.Y.Z / :latest
# 手动触发（workflow_dispatch）→ 可指定 platforms（如 linux/amd64,linux/arm64）

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/self-hosted-*.mjs"
      - "migrations/**"
      - "patches/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "bunfig.toml"
      - "package.json"
      - "bun.lock"
      - "tailwind.config.ts"
      - "tsconfig.json"
      - ".github/workflows/custom-docker-image.yml"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated Buildx platforms (default linux/amd64)"
        required: false
        default: "linux/amd64"
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE_NAME: ghcr.io/ikun-yinmie/edgeever

jobs:
  container-test:
    name: Build and verify container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build local image
        run: docker build --build-arg EDGE_EVER_BUILD_ID="${GITHUB_SHA}" --tag edgeever:ci .

      - name: Start container
        run: |
          docker run --detach --name edgeever-ci \
            --env EDGE_EVER_AUTH_PASSWORD=container-ci-password \
            --publish 127.0.0.1:8787:8787 \
            edgeever:ci

      - name: Verify shared API and persistent storage
        run: |
          for attempt in $(seq 1 60); do
            if health="$(curl --fail --silent --show-error http://127.0.0.1:8787/api/health)"; then
              break
            fi
            sleep 1
          done
          echo "${health}" | jq -e '.ok == true and .runtime == "self-hosted-bun" and .authMode == "required"'
          curl --fail --silent --show-error http://127.0.0.1:8787/ | grep -F '<!doctype html>'
          docker exec edgeever-ci test -f /data/edgeever.sqlite
          docker exec edgeever-ci test -d /data/resources
          docker exec edgeever-ci test -s /app/scripts/self-hosted-server.js

      - name: Stop container gracefully
        run: |
          docker stop --timeout 30 edgeever-ci
          docker logs edgeever-ci | grep -F '[self-hosted] shutdown complete'

      - name: Show container logs on failure
        if: failure()
        run: docker logs edgeever-ci || true

  publish:
    needs: container-test
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image tags
        id: image
        env:
          PLATFORMS_INPUT: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          echo "platforms=${PLATFORMS_INPUT:-linux/amd64}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            {
              echo "tags<<EOF"
              echo "${GHCR_IMAGE_NAME}:${release_tag}"
              echo "${GHCR_IMAGE_NAME}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "version=${release_tag}" >> "${GITHUB_OUTPUT}"
          else
            {
              echo "tags<<EOF"
              echo "${GHCR_IMAGE_NAME}:main"
              echo "${GHCR_IMAGE_NAME}:sha-${short_sha}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "version=main" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            EDGE_EVER_BUILD_ID=${{ github.sha }}
          platforms: ${{ steps.image.outputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        run: |
          tag="main"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          docker run --detach --name edgeever-smoke \
            --env EDGE_EVER_AUTH_PASSWORD=smoke-test-password \
            --publish 127.0.0.1:8788:8787 \
            "${GHCR_IMAGE_NAME}:${tag}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8788/api/health | jq -e '.ok == true'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8788/api/health | jq -e '.ok == true'
          docker rm --force edgeever-smoke >/dev/null

      - name: Check anonymous pull (advisory)
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          if timeout 120 docker pull "${GHCR_IMAGE_NAME}:main" >/dev/null 2>&1; then
            echo "Anonymous pull OK — package is public."
          else
            echo "::warning::Anonymous pull failed. If this is the first publish, open https://github.com/users/ikun-yinmie/packages/container/edgeever/settings and change visibility to Public."
          fi
